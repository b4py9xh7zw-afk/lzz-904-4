<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>监控视频增强工具</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>🎥 监控视频增强工具</h1>
  <span class="sub">亮度 · 降噪 · 锐化 · 区域裁剪 &nbsp;|&nbsp; 本地处理，无需数据库 · 结果保留 24 小时</span>
</header>

<main class="layout">
  <!-- 左：视频与裁剪 -->
  <section class="panel video-panel">
    <div class="upload-row">
      <label class="btn primary">
        选择监控样片
        <input type="file" id="fileInput" accept="video/*,.mp4,.mov,.avi,.mkv,.flv,.ts,.m4v,.webm,.wmv" hidden>
      </label>
      <span id="fileName" class="filename">尚未上传文件</span>
      <span id="uploadStatus" class="status"></span>
    </div>

    <div class="stage-wrap">
      <div id="stage" class="stage empty">
        <video id="video" playsinline preload="metadata" controls></video>
        <div id="cropBox" class="crop-box" hidden>
          <span class="crop-label">裁剪区域</span>
          <div class="handle nw" data-dir="nw"></div>
          <div class="handle ne" data-dir="ne"></div>
          <div class="handle sw" data-dir="sw"></div>
          <div class="handle se" data-dir="se"></div>
        </div>
        <div id="stageHint" class="stage-hint">请先上传一段监控视频</div>
      </div>
    </div>
    <div id="meta" class="meta hidden">
      <span>分辨率：<b id="mRes">-</b></span>
      <span>时长：<b id="mDur">-</b></span>
      <span>编码：<b id="mCodec">-</b></span>
      <span>音频：<b id="mAudio">-</b></span>
    </div>

    <div id="alertBox" class="alert hidden"></div>
  </section>

  <!-- 右：控制与结果 -->
  <aside class="panel controls">
    <h2>增强参数</h2>

    <div class="control">
      <label>亮度 <span id="brightnessVal">0.00</span></label>
      <input type="range" id="brightness" min="-1" max="1" step="0.05" value="0">
      <div class="range-note"><span>-1 很暗</span><span>0 原始</span><span>+1 很亮</span></div>
    </div>

    <div class="control">
      <label>降噪强度 <span id="denoiseVal">0.00</span></label>
      <input type="range" id="denoise" min="0" max="1" step="0.05" value="0">
      <div class="range-note"><span>关闭</span><span>中等</span><span>最强</span></div>
    </div>

    <div class="control">
      <label>锐化强度 <span id="sharpenVal">0.00</span></label>
      <input type="range" id="sharpen" min="0" max="1" step="0.05" value="0">
      <div class="range-note"><span>关闭</span><span>中等</span><span>最强</span></div>
    </div>

    <div class="control crop-control">
      <label class="checkline">
        <input type="checkbox" id="cropEnabled">
        启用区域裁剪
      </label>
      <div id="cropInfo" class="crop-info">未启用</div>
      <button type="button" id="resetCrop" class="btn tiny" hidden>重置为整幅画面</button>
    </div>

    <hr>

    <h2>生成结果</h2>
    <div class="control">
      <label>截图时间点（秒）<span id="atVal">0.0</span></label>
      <input type="range" id="at" min="0" max="0" step="0.1" value="0" disabled>
      <button type="button" id="snapBtn" class="btn block" disabled>📸 生成截图预览</button>
    </div>

    <div class="control">
      <div class="row2">
        <div>
          <label for="start">开始（秒）</label>
          <input type="number" id="start" min="0" step="0.1" value="0" disabled>
        </div>
        <div>
          <label for="duration">时长（秒，≤<span id="maxDur">8</span>）</label>
          <input type="number" id="duration" min="0.1" step="0.1" value="3" disabled>
        </div>
      </div>
      <button type="button" id="clipBtn" class="btn block" disabled>🎬 生成短片段</button>
    </div>

    <div id="result" class="result hidden">
      <div class="result-head">
        <h3 id="resultTitle">结果</h3>
        <a id="downloadLink" class="btn tiny" download>下载</a>
      </div>
      <div id="resultBody"></div>
      <pre id="resultParams" class="params"></pre>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
